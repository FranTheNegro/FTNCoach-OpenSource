[ABOUT]
NAME = FTN Coach
AUTHOR = FTN Coach (open source, MIT)
VERSION = 0.4
DESCRIPTION = Overlays de telemetría en vivo con el diseño de FTN Coach: coach, delta, tacómetro, inputs, tiempos, relative, neumáticos, auto, vueltas, mapa, radar y banderas, con layouts recomendados según la categoría del auto (Fórmula, GT, Prototipos, Turismo, Rally, Drift y Calle). Con FTN Coach abierto en la PC suma delta, consejos por curva y tu foco de manejo.
REQUIRED_VERSION = 2051

; "FTN Coach" (el ícono de la barra de apps) es el centro de control: layout, overlays y ajustes.
; Cada overlay es una ventana sin marco (como CMRT Complete HUD): AC reserva 22 px arriba para su
; barra, que solo aparece al pasar el mouse; el tamaño lo maneja la app según la escala de cada
; overlay y, fuera del modo acomodar, las ventanas quedan fijas (lib/layout.lua).

[WINDOW_...]
ID = main
NAME = FTN Coach
ICON = icon.png
FUNCTION_MAIN = windowMain
SIZE = 780, 540
MIN_SIZE = 620, 420
FLAGS = NO_COLLAPSE, MAIN

