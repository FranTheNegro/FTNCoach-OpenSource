[ABOUT]
NAME = FTN Coach
AUTHOR = FTN Coach (open source, MIT)
VERSION = 0.2
DESCRIPTION = Overlays de telemetría en vivo con el diseño de FTN Coach: coach, delta, tacómetro, inputs, tiempos, relative, neumáticos, auto, vueltas, mapa, radar y banderas. Con FTN Coach abierto en la PC suma delta, consejos por curva y tu foco de manejo.
REQUIRED_VERSION = 2051

; Cada overlay es una ventana: se activa desde la barra de apps y se agranda estirándola.

[WINDOW_...]
ID = main
NAME = FTN Coach
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
SIZE = 360, 236
MIN_SIZE = 180, 118
PADDING = 0, 0
FLAGS = SETTINGS, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, NO_BACKGROUND, MAIN

